services:
  mysql:
    image: mysql:8.0
    container_name: food-ordering-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: food_ordering
      MYSQL_USER: food_user
      MYSQL_PASSWORD: food_password
    ports:
      - "3306:3306"
    volumes:
      - food_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  food_mysql_data:
